<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Dynasty — Uzair, Maryam, Zahra, Zain</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">

<style>
  :root{
    --slate:#16322B;
    --chalk:#EFEDE3;
    --chalk-dim:#9FB6AA;
    --rule:rgba(239,237,227,.15);
    --rule-2:rgba(239,237,227,.32);
    --uzair:#F5B944;
    --maryam:#BBA3F5;
    --zahra:#6FD3E8;
    --zain:#FF8065;
    --display:'Anton','Arial Narrow',Impact,sans-serif;
    --body:'Archivo',system-ui,-apple-system,sans-serif;
    --mono:'Space Mono',ui-monospace,'Courier New',monospace;
  }
  *{box-sizing:border-box}
  html{-webkit-text-size-adjust:100%}
  body{
    margin:0;padding:28px 20px 40px;min-height:100vh;
    background:radial-gradient(120% 90% at 50% 0%,#1F473C 0%,var(--slate) 55%,#102520 100%);
    background-attachment:fixed;color:var(--chalk);font-family:var(--body);
    -webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;
  }
  body::after{
    content:"";position:fixed;inset:0;pointer-events:none;opacity:.15;mix-blend-mode:overlay;
    background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='180' height='180'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='.8' numOctaves='3'/></filter><rect width='180' height='180' filter='url(%23n)' opacity='.5'/></svg>");
  }
  .wrap{max-width:1080px;margin:0 auto;position:relative;z-index:1}
  button{font:inherit}
  button:focus-visible{outline:2px solid var(--chalk);outline-offset:3px}

  .masthead{border-bottom:1px solid var(--rule);padding-bottom:20px;margin-bottom:26px}
  .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.34em;text-transform:uppercase;
    color:var(--chalk-dim);margin:0 0 10px}
  h1{font-family:var(--display);font-size:clamp(46px,9vw,88px);line-height:.86;margin:0;
    text-transform:uppercase;letter-spacing:.015em;font-weight:400}
  .tagline{font-family:var(--mono);font-size:12px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--chalk-dim);margin:14px 0 0;line-height:1.7}
  .masthead .names{display:flex;gap:16px;flex-wrap:wrap;margin-top:12px;
    font-family:var(--mono);font-size:12px;letter-spacing:.16em;text-transform:uppercase}
  .masthead .names span{display:inline-flex;align-items:center;gap:7px;color:var(--chalk-dim)}
  .swatch{width:9px;height:9px;border-radius:50%}

  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(320px,.86fr);gap:40px;align-items:start}
  @media (max-width:900px){.cols{grid-template-columns:1fr;gap:30px}}
  .panel-title{font-family:var(--mono);font-size:11px;letter-spacing:.3em;text-transform:uppercase;
    color:var(--chalk-dim);margin:0 0 14px;font-weight:400}
  .block{margin-top:30px}

  .modes{display:inline-flex;border:1px solid var(--rule-2);border-radius:2px;overflow:hidden;margin-bottom:14px}
  .modes button{background:transparent;border:0;color:var(--chalk-dim);font-family:var(--mono);
    font-size:11px;letter-spacing:.14em;text-transform:uppercase;padding:10px 15px;cursor:pointer;
    transition:background .15s,color .15s}
  .modes button+button{border-left:1px solid var(--rule-2)}
  .modes button[aria-pressed="true"]{background:rgba(239,237,227,.12);color:var(--chalk)}

  .setup{display:flex;flex-wrap:wrap;gap:7px;align-items:center;margin-bottom:16px;min-height:36px}
  .chip{background:transparent;border:1px solid var(--rule);color:var(--chalk-dim);border-radius:2px;
    font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;
    padding:8px 10px;cursor:pointer;transition:border-color .15s,color .15s,background .15s}
  .chip:hover{border-color:var(--rule-2);color:var(--chalk)}
  .chip[aria-pressed="true"]{background:rgba(239,237,227,.12);color:var(--chalk);border-color:var(--rule-2)}
  .chip.static{cursor:default;background:rgba(239,237,227,.12);color:var(--chalk);border-color:var(--rule-2)}
  .divider{width:1px;height:20px;background:var(--rule);margin:0 2px}

  .board-shell{position:relative;width:100%;max-width:480px;aspect-ratio:1/1;
    user-select:none;-webkit-user-select:none;touch-action:manipulation}
  .layer{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
  /* Both axes declared: without explicit rows the tracks size to content
     and the marks drift off the chalk lines. */
  .cells{position:absolute;inset:0;display:grid}
  .cell{background:transparent;border:0;padding:0;margin:0;cursor:pointer;position:relative;
    min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;
    touch-action:manipulation}
  .cell:disabled{cursor:default}
  .cell::after{content:"";position:absolute;inset:12%;border-radius:50%;opacity:0;
    background:radial-gradient(circle,rgba(239,237,227,.10),transparent 70%);transition:opacity .15s}
  .cell.open:hover::after{opacity:1}
  /* Sized from width + aspect-ratio, never a percentage height. */
  .cell .mark{width:64%;height:auto;aspect-ratio:1/1;overflow:visible;display:block;
    transition:opacity .45s ease}
  .mark path{fill:none;stroke-linecap:round;stroke-linejoin:round;stroke-width:6.6;
    opacity:.95;filter:url(#chalk)}
  .mark.fresh path{stroke-dasharray:1;stroke-dashoffset:1;animation:draw .26s ease-out forwards}
  .mark.fresh path:nth-child(2){animation-delay:.12s}
  @keyframes draw{to{stroke-dashoffset:0}}

  .cell.faded .mark{opacity:.22}
  .cell.won .mark{animation:flare 1s .18s ease-out 2}
  @keyframes flare{
    0%,100%{filter:none;transform:scale(1)}
    45%{filter:drop-shadow(0 0 9px currentColor);transform:scale(1.07)}
  }
  .strike{fill:none;stroke-width:2.4;stroke-linecap:round;opacity:.95;filter:url(#chalk);
    stroke-dasharray:1;stroke-dashoffset:1;animation:draw .45s .1s ease-out forwards}
  .dust{opacity:0;animation:dust 1.5s .35s ease-out forwards}
  @keyframes dust{
    0%{opacity:.85;transform:translate(0,0) scale(1)}
    100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(.4)}
  }
  @media (prefers-reduced-motion:reduce){
    .mark.fresh path,.strike{animation:none;stroke-dashoffset:0}
    .cell.won .mark{animation:none}
    .dust{display:none}
    *{transition-duration:.01ms !important}
  }

  .now{border-top:1px solid var(--rule);padding-top:16px}
  .headline{font-family:var(--display);font-size:clamp(28px,4.4vw,36px);line-height:1.05;
    text-transform:uppercase;letter-spacing:.02em;font-weight:400;min-height:38px}
  .headline-sub{font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;
    color:var(--chalk-dim);margin-top:6px;min-height:16px;line-height:1.5}
  .seats{margin:18px 0 0;display:grid;gap:2px}
  .seat{display:grid;grid-template-columns:24px minmax(0,1fr) auto;gap:12px;align-items:center;
    padding:10px 12px 10px 10px;border-left:2px solid transparent;
    background:transparent;transition:background .2s,border-color .2s,opacity .2s}
  .seat.active{background:rgba(239,237,227,.07)}
  .seat.out{opacity:.4}
  .seat-mark{width:22px;height:22px;overflow:visible;display:block}
  .seat-mark path{fill:none;stroke-width:8;stroke-linecap:round;stroke-linejoin:round;filter:url(#chalk)}
  .seat-name{font-family:var(--display);font-size:22px;line-height:1;text-transform:uppercase;
    letter-spacing:.02em;font-weight:400;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .seat-state{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;
    color:var(--chalk-dim);white-space:nowrap}
  .seat.active .seat-state,.seat.winner .seat-state{color:var(--chalk)}
  .actions{display:flex;gap:8px;margin-top:18px;flex-wrap:wrap}
  .act{background:var(--chalk);color:#16322B;border:0;border-radius:2px;padding:11px 16px;cursor:pointer;
    font-family:var(--mono);font-size:11px;letter-spacing:.14em;text-transform:uppercase;font-weight:700;
    transition:opacity .15s}
  .act:hover{opacity:.86}
  .act.ghost{background:transparent;color:var(--chalk-dim);border:1px solid var(--rule);font-weight:400}
  .act.ghost:hover{color:var(--chalk);border-color:var(--rule-2);opacity:1}
  .act:disabled{opacity:.3;cursor:default}
  .act[hidden]{display:none}

  .rows{border-top:1px solid var(--rule)}
  .row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:16px;align-items:start;
    padding:14px 0;border-bottom:1px solid var(--rule)}
  .who{display:flex;align-items:baseline;gap:10px}
  .name{font-family:var(--display);font-size:25px;line-height:1;text-transform:uppercase;
    letter-spacing:.02em;font-weight:400}
  .rank{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);letter-spacing:.1em}
  .tally{display:flex;flex-wrap:wrap;gap:9px;align-items:center;margin-top:9px;min-height:26px;
    filter:url(#chalk)}
  .tally svg{height:24px;display:block}
  .tally .none{font-family:var(--mono);font-size:11px;color:var(--chalk-dim);letter-spacing:.1em;filter:none}
  .figures{text-align:right;font-family:var(--mono);font-size:11px;color:var(--chalk-dim);
    letter-spacing:.06em;line-height:1.7;white-space:nowrap}
  .figures b{display:block;color:var(--chalk);font-family:var(--display);font-size:24px;
    font-weight:400;letter-spacing:.02em;line-height:1}
  .figures i{font-style:normal;font-size:10px;letter-spacing:.2em}
  .h2h-row{display:flex;justify-content:space-between;gap:12px;font-family:var(--mono);font-size:11.5px;
    padding:9px 0;border-bottom:1px solid var(--rule)}
  .h2h-row .res{color:var(--chalk-dim);letter-spacing:.06em}
  .log{list-style:none;margin:0;padding:0;font-family:var(--mono);font-size:11.5px;color:var(--chalk-dim)}
  .log li{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--rule)}
  .log b{color:var(--chalk);font-weight:400}
  .empty{font-family:var(--mono);font-size:12px;color:var(--chalk-dim);line-height:1.7;padding:8px 0}
  .foot{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap;align-items:center;
    margin-top:34px;padding-top:18px;border-top:1px solid var(--rule);
    font-family:var(--mono);font-size:11px;letter-spacing:.1em;color:var(--chalk-dim);text-transform:uppercase}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
</style>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
  <filter id="chalk" x="-15%" y="-15%" width="130%" height="130%" color-interpolation-filters="sRGB">
    <feTurbulence type="fractalNoise" baseFrequency="0.62" numOctaves="3" seed="11" result="n"/>
    <feDisplacementMap in="SourceGraphic" in2="n" scale="1.9" xChannelSelector="R" yChannelSelector="G"/>
  </filter>
</svg>

<div class="wrap">
  <header class="masthead">
    <p class="eyebrow">Tic tac toe</p>
    <h1>Dynasty</h1>
    <p class="tagline">Four claimants. Nine squares. The throne changes hands weekly.</p>
    <div class="names">
      <span><i class="swatch" style="background:var(--uzair)"></i>Uzair</span>
      <span><i class="swatch" style="background:var(--maryam)"></i>Maryam</span>
      <span><i class="swatch" style="background:var(--zahra)"></i>Zahra</span>
      <span><i class="swatch" style="background:var(--zain)"></i>Zain</span>
    </div>
  </header>

  <div class="cols">
    <section>
      <h2 class="panel-title">The board</h2>
      <div class="modes" role="group" aria-label="Game mode">
        <button id="mode-duel" aria-pressed="true">Duel · 3×3</button>
        <button id="mode-free" aria-pressed="false">Free-for-all · 6×6</button>
      </div>
      <div class="setup" id="setup"></div>
      <div class="board-shell">
        <svg class="layer" id="grid" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
        <svg class="layer" id="strike" viewBox="0 0 100 100" aria-hidden="true" focusable="false"></svg>
        <div class="cells" id="cells" role="group" aria-label="Game board"></div>
      </div>
    </section>

    <section>
      <h2 class="panel-title">Now playing</h2>
      <div class="now">
        <div class="headline" id="headline"></div>
        <div class="headline-sub" id="headline-sub"></div>
        <div class="seats" id="seats"></div>
        <div class="actions">
          <button class="act" id="primary"></button>
          <button class="act ghost" id="undo">Undo move</button>
        </div>
      </div>
      <div class="block">
        <h2 class="panel-title">Series standings</h2>
        <div class="rows" id="standings"></div>
      </div>
      <div class="block">
        <h2 class="panel-title">Head to head</h2>
        <div id="h2h"></div>
      </div>
      <div class="block">
        <h2 class="panel-title">Recent games</h2>
        <ul class="log" id="log"></ul>
      </div>
    </section>
  </div>

  <div class="foot">
    <span id="note">3 points for a win · 1 for a draw</span>
    <button class="act ghost" id="reset">Reset ledger</button>
  </div>
  <p class="sr" id="live" role="status" aria-live="polite"></p>
</div>

<script>
(function(){
  "use strict";

  var PLAYERS = [
    { id:"uzair",  name:"Uzair",  mark:"x", color:"var(--uzair)",  raw:"#F5B944" },
    { id:"maryam", name:"Maryam", mark:"d", color:"var(--maryam)", raw:"#BBA3F5" },
    { id:"zahra",  name:"Zahra",  mark:"o", color:"var(--zahra)",  raw:"#6FD3E8" },
    { id:"zain",   name:"Zain",   mark:"t", color:"var(--zain)",   raw:"#FF8065" }
  ];
  var P = {}; PLAYERS.forEach(function(p){ P[p.id] = p; });
  var IDS = PLAYERS.map(function(p){ return p.id; });

  // All six pairings, generated so adding a fifth player would need no edits here.
  var PAIRS = [];
  for(var a=0; a<IDS.length; a++)
    for(var b=a+1; b<IDS.length; b++) PAIRS.push([IDS[a], IDS[b]]);

  var KEY = "tictactoe:ledger:v3";

  // Every shape is centred on (50,50). The triangle's apex and base are placed so
  // its OPTICAL centre lands on 50 — its bounding box centre would sit visibly low.
  // The diamond's centroid is already the centre, so it needs no correction.
  var SHAPES = {
    x: ["M23,23 Q50,48 77,77", "M77,23 Q50,52 23,77"],
    o: ["M52,20 C69,20 80,33 80,50 C80,67 67,80 50,80 C33,80 20,67 20,50 C20,33 32,20 48,20.5"],
    t: ["M50,16 L82,74 L18,74 L52,16"],
    d: ["M50,17 L83,50 L50,83 L17,50 L52,18"]
  };

  var el = {};
  ["setup","grid","strike","cells","headline","headline-sub","seats","undo","primary",
   "reset","standings","h2h","log","note","live"].forEach(function(k){
    el[k] = document.getElementById(k);
  });

  var ledger = blankLedger();
  var storageOK = true;
  var mode = "duel";
  var winnerStays = true;
  var queue = IDS.slice();            // [on board, on board, waiting…]
  var pair = [IDS[0], IDS[1]];
  var starterFlip = 0;
  var resetArmed = false, resetTimer = null;
  var game = null, cellNodes = [], seatNodes = {}, builtSize = 0, gridCache = {};

  /* ---------------- ledger ---------------- */

  function blankLedger(){
    var l = { stats:{}, h2h:{}, log:[] };
    IDS.forEach(function(id){ l.stats[id] = { p:0, w:0, d:0, l:0 }; });
    PAIRS.forEach(function(pr){ l.h2h[pr.join("|")] = { a:0, b:0, d:0 }; });
    return l;
  }

  function heal(raw){
    var l = blankLedger();
    if(!raw || typeof raw !== "object") return l;
    IDS.forEach(function(id){
      var s = raw.stats && raw.stats[id];
      if(s) l.stats[id] = { p:+s.p||0, w:+s.w||0, d:+s.d||0, l:+s.l||0 };
    });
    PAIRS.forEach(function(pr){
      var k = pr.join("|"), h = raw.h2h && raw.h2h[k];
      if(h) l.h2h[k] = { a:+h.a||0, b:+h.b||0, d:+h.d||0 };
    });
    if(Array.isArray(raw.log)){
      l.log = raw.log.filter(function(g){
        return g && Array.isArray(g.players) && g.players.every(function(id){ return P[id]; });
      }).slice(0,14);
    }
    return l;
  }

  // Two backends, picked at runtime: the artifact storage API when this runs
  // inside Claude, plain localStorage when it's hosted on your own domain.
  var store = (function(){
    if(window.storage) return {
      get: function(){ return window.storage.get(KEY).then(function(r){ return r && r.value; }); },
      set: function(v){ return window.storage.set(KEY, v); }
    };
    try {
      window.localStorage.setItem(KEY+":probe","1");
      window.localStorage.removeItem(KEY+":probe");
      return {
        get: function(){ return Promise.resolve(window.localStorage.getItem(KEY)); },
        set: function(v){ window.localStorage.setItem(KEY, v); return Promise.resolve(); }
      };
    } catch(e){ return null; }   // private mode, or storage blocked
  })();

  function load(){
    if(!store){ storageOK = false; return Promise.resolve(); }
    return store.get().then(function(v){
      if(v) ledger = heal(JSON.parse(v));
    })["catch"](function(){});
  }

  function save(){
    if(!store){ storageOK = false; return note(); }
    store.set(JSON.stringify(ledger)).then(function(){
      if(!storageOK){ storageOK = true; note(); }
    })["catch"](function(){ storageOK = false; note(); });
  }

  function note(){
    el.note.textContent = storageOK
      ? "3 points for a win · 1 for a draw"
      : "Scores last until you close this tab — they aren't saving here";
  }

  function points(id){ var s = ledger.stats[id]; return s.w*3 + s.d; }

  /* ---------------- shapes ---------------- */

  function markPaths(id, animated){
    return SHAPES[P[id].mark].map(function(d){
      return '<path d="'+d+'" pathLength="1" stroke="'+P[id].color+'"'+
             (animated ? '' : ' style="stroke-dasharray:none;stroke-dashoffset:0"')+'/>';
    }).join("");
  }

  function rng(seed){
    return function(){ seed = (seed*1664525 + 1013904223) >>> 0; return seed/4294967296; };
  }

  function gridMarkup(n){
    if(gridCache[n]) return gridCache[n];
    var rand = rng(n*977 + 13), step = 100/n, out = "";
    function line(x1,y1,x2,y2){
      var mx = (x1+x2)/2 + (rand()*2-1)*1.2, my = (y1+y2)/2 + (rand()*2-1)*1.2;
      out += '<path d="M'+x1+','+y1+' Q'+mx.toFixed(2)+','+my.toFixed(2)+' '+x2+','+y2+'" '+
             'fill="none" stroke="rgba(239,237,227,.3)" stroke-width="1.1" stroke-linecap="round"/>';
    }
    for(var i=1;i<n;i++){ var v = +(i*step).toFixed(2); line(v,4,v,96); line(4,v,96,v); }
    gridCache[n] = '<g filter="url(#chalk)">'+out+'</g>';
    return gridCache[n];
  }

  function tally(n, color){
    if(n === 0) return '<span class="none">no wins yet</span>';
    var out = "", left = n;
    while(left > 0){
      var g = Math.min(5, left); left -= g;
      var s = "", bars = Math.min(g,4);
      for(var i=0;i<bars;i++){ var x = 4 + i*6.5; s += '<path d="M'+(x+1.2)+',3 L'+x+',25"/>'; }
      if(g === 5) s += '<path d="M1,25 L30,3"/>';
      out += '<svg viewBox="0 0 32 28" width="'+(g===5?32:bars*6.5+6)+'" height="24" '+
             'fill="none" stroke="'+color+'" stroke-width="2.6" stroke-linecap="round" '+
             'aria-hidden="true">'+s+'</svg>';
    }
    return out;
  }

  /* ---------------- game ---------------- */

  function newGame(){
    var size = mode === "duel" ? 3 : 6;
    var order = mode === "duel" ? pair.slice() : IDS.slice();
    if(mode === "duel" && starterFlip % 2 === 1) order.reverse();
    game = {
      size: size, need: mode === "duel" ? 3 : 4, order: order, turn: 0,
      cells: new Array(size*size).fill(null), moves: [],
      over: false, winner: null, line: null, counted: false
    };
    buildBoard();
    el.strike.innerHTML = "";
    renderSetup();
    renderStatus();
  }

  function findWin(cells, size, need, idx){
    var id = cells[idx];
    if(!id) return null;
    var r = Math.floor(idx/size), c = idx % size;
    var dirs = [[0,1],[1,0],[1,1],[1,-1]];
    for(var d=0; d<dirs.length; d++){
      var dr = dirs[d][0], dc = dirs[d][1], line = [idx];
      for(var k=0; k<2; k++){
        var s = k ? -1 : 1, rr = r + dr*s, cc = c + dc*s;
        while(rr>=0 && rr<size && cc>=0 && cc<size && cells[rr*size+cc] === id){
          line.push(rr*size+cc); rr += dr*s; cc += dc*s;
        }
      }
      if(line.length >= need) return line.sort(function(a,b){ return a-b; });
    }
    return null;
  }

  function play(idx){
    if(!game || game.over || game.cells[idx]) return;
    var id = game.order[game.turn];
    game.cells[idx] = id;
    game.moves.push(idx);
    paintCell(idx, true);

    var line = findWin(game.cells, game.size, game.need, idx);
    if(line){ game.over = true; game.winner = id; game.line = line; }
    else if(game.moves.length === game.cells.length){ game.over = true; game.winner = null; }
    else { game.turn = (game.turn + 1) % game.order.length; }

    if(game.over){
      lockBoard();
      if(game.winner) celebrate();
      if(!game.counted){
        game.counted = true;
        record(game.order.slice(), game.winner);
        if(mode === "duel") advanceQueue(game.winner);
        starterFlip++;
        renderLedger();
        renderSetup();
      }
    } else {
      setOpen(idx, false);
    }
    renderStatus();
  }

  function undo(){
    if(!game || game.over || !game.moves.length) return;
    var idx = game.moves.pop();
    game.cells[idx] = null;
    paintCell(idx, false);
    setOpen(idx, true);
    game.turn = (game.turn - 1 + game.order.length) % game.order.length;
    renderStatus();
  }

  // King of the hill across four: the winner holds the board, the loser goes to
  // the back of the line, and the next player waiting steps in.
  function advanceQueue(winner){
    var a = queue[0], b = queue[1], rest = queue.slice(2);
    if(winner){
      var loser = (winner === a) ? b : a;
      queue = [winner].concat(rest, [loser]);
    } else {
      queue = rest.concat([a, b]);
    }
    if(winnerStays) pair = [queue[0], queue[1]];
  }

  function record(players, winner){
    players.forEach(function(id){ ledger.stats[id].p++; });
    if(winner){
      ledger.stats[winner].w++;
      players.forEach(function(id){ if(id !== winner) ledger.stats[id].l++; });
    } else {
      players.forEach(function(id){ ledger.stats[id].d++; });
    }
    if(players.length === 2){
      var key = null;
      PAIRS.forEach(function(pr){
        if(pr.indexOf(players[0]) > -1 && pr.indexOf(players[1]) > -1) key = pr.join("|");
      });
      if(key){
        var h = ledger.h2h[key];
        if(!winner) h.d++;
        else if(winner === key.split("|")[0]) h.a++;
        else h.b++;
      }
    }
    ledger.log.unshift({ players: players.slice(), winner: winner || null,
                         mode: players.length > 2 ? "free" : "duel" });
    ledger.log = ledger.log.slice(0,14);
    save();
  }

  /* ---------------- board ---------------- */

  function buildBoard(){
    if(builtSize !== game.size){
      builtSize = game.size;
      el.grid.innerHTML = gridMarkup(game.size);
      el.cells.style.gridTemplateColumns = "repeat("+game.size+",1fr)";
      el.cells.style.gridTemplateRows = "repeat("+game.size+",1fr)";
      el.cells.innerHTML = "";
      cellNodes = [];
      for(var i=0;i<game.size*game.size;i++){
        var b = document.createElement("button");
        b.type = "button"; b.className = "cell open"; b.dataset.i = i;
        el.cells.appendChild(b);
        cellNodes.push(b);
      }
    }
    for(var j=0;j<cellNodes.length;j++){
      cellNodes[j].innerHTML = "";
      cellNodes[j].className = "cell open";
      cellNodes[j].disabled = false;
      cellNodes[j].style.color = "";
      label(j);
    }
  }

  function paintCell(i, animate){
    var node = cellNodes[i], id = game.cells[i];
    node.innerHTML = id
      ? '<svg class="mark'+(animate ? ' fresh' : '')+'" viewBox="0 0 100 100" aria-hidden="true" '+
        'focusable="false">'+markPaths(id, animate)+'</svg>'
      : "";
    label(i);
  }

  function setOpen(i, open){
    cellNodes[i].disabled = !open;
    cellNodes[i].classList.toggle("open", open);
    label(i);
  }

  function label(i){
    var r = Math.floor(i/game.size)+1, c = i%game.size+1, id = game.cells[i];
    cellNodes[i].setAttribute("aria-label",
      "Row "+r+", column "+c+(id ? ", " + P[id].name : ", empty"));
  }

  function lockBoard(){
    for(var i=0;i<cellNodes.length;i++){
      cellNodes[i].disabled = true;
      cellNodes[i].classList.remove("open");
    }
  }

  function celebrate(){
    var n = game.size, step = 100/n, win = {};
    game.line.forEach(function(i){ win[i] = true; });
    for(var i=0;i<cellNodes.length;i++){
      cellNodes[i].classList.remove("won","faded");
      if(win[i]) cellNodes[i].style.color = P[game.winner].raw;
      else if(game.cells[i]) cellNodes[i].classList.add("faded");
    }
    void el.cells.getBoundingClientRect();      // force reflow so the flare replays
    game.line.forEach(function(i){ cellNodes[i].classList.add("won"); });

    var a = game.line[0], b = game.line[game.line.length-1];
    var x1 = (a%n + .5)*step, y1 = (Math.floor(a/n) + .5)*step;
    var x2 = (b%n + .5)*step, y2 = (Math.floor(b/n) + .5)*step;
    var dx = x2-x1, dy = y2-y1, len = Math.sqrt(dx*dx+dy*dy) || 1, pad = step*0.32;
    var sx = x1 - dx/len*pad, sy = y1 - dy/len*pad;
    var ex = x2 + dx/len*pad, ey = y2 + dy/len*pad;

    var svg = '<path class="strike" pathLength="1" stroke="'+P[game.winner].color+'" d="M'+
      sx.toFixed(2)+','+sy.toFixed(2)+' L'+ex.toFixed(2)+','+ey.toFixed(2)+'"/>';
    var rand = rng(Date.now() % 100000);
    for(var k=0;k<14;k++){
      var t = rand(), px = sx + (ex-sx)*t, py = sy + (ey-sy)*t;
      svg += '<circle class="dust" cx="'+px.toFixed(2)+'" cy="'+py.toFixed(2)+'" r="'+
        (0.4 + rand()*0.7).toFixed(2)+'" fill="'+P[game.winner].color+
        '" style="--dx:'+((rand()*2-1)*5).toFixed(2)+'px;--dy:'+(3 + rand()*9).toFixed(2)+
        'px;animation-delay:'+(0.3 + t*0.35).toFixed(2)+'s"/>';
    }
    el.strike.innerHTML = svg;
    void el.strike.getBoundingClientRect();
  }

  /* ---------------- panels ---------------- */

  function renderSetup(){
    if(mode === "free"){
      el.setup.innerHTML = '<span class="chip static">All four · four in a row wins</span>';
      return;
    }
    el.setup.innerHTML = "";
    PAIRS.forEach(function(pr){
      var b = document.createElement("button");
      b.type = "button"; b.className = "chip";
      b.textContent = P[pr[0]].name + " v " + P[pr[1]].name;
      b.setAttribute("aria-pressed",
        (pr.indexOf(pair[0]) > -1 && pr.indexOf(pair[1]) > -1) ? "true" : "false");
      b.addEventListener("click", function(){
        pair = pr.slice();
        queue = pr.concat(IDS.filter(function(id){ return pr.indexOf(id) < 0; }));
        newGame();
      });
      el.setup.appendChild(b);
    });
    var sep = document.createElement("span"); sep.className = "divider";
    el.setup.appendChild(sep);
    var t = document.createElement("button");
    t.type = "button"; t.className = "chip"; t.textContent = "Winner stays on";
    t.setAttribute("aria-pressed", winnerStays ? "true" : "false");
    t.addEventListener("click", function(){
      winnerStays = !winnerStays;
      if(winnerStays) pair = [queue[0], queue[1]];
      renderSetup();
      renderStatus();
    });
    el.setup.appendChild(t);
  }

  function buildSeats(){
    el.seats.innerHTML = "";
    PLAYERS.forEach(function(p){
      var row = document.createElement("div");
      row.className = "seat";
      row.innerHTML =
        '<svg class="seat-mark" viewBox="0 0 100 100" aria-hidden="true" focusable="false">'+
          markPaths(p.id, false)+'</svg>'+
        '<span class="seat-name" style="color:'+p.color+'">'+p.name+'</span>'+
        '<span class="seat-state"></span>';
      el.seats.appendChild(row);
      seatNodes[p.id] = { row: row, state: row.querySelector(".seat-state") };
    });
  }

  function listNames(ids){
    var n = ids.map(function(id){ return P[id].name; });
    return n.length > 1 ? n.slice(0,-1).join(", ") + " and " + n[n.length-1] : n[0];
  }

  function renderStatus(){
    var current = game.over ? null : game.order[game.turn];
    var playing = {}; game.order.forEach(function(id){ playing[id] = true; });
    var out = IDS.filter(function(id){ return !playing[id]; });

    if(game.over){
      if(game.winner){
        el.headline.textContent = P[game.winner].name + " wins";
        el.headline.style.color = P[game.winner].color;
        el["headline-sub"].textContent = mode === "duel" && winnerStays
          ? "Holds the board · next up " + P[pair[0]].name + " v " + P[pair[1]].name
          : "Added to the ledger";
      } else {
        el.headline.textContent = "Drawn";
        el.headline.style.color = "";
        el["headline-sub"].textContent = mode === "duel"
          ? "A point each · next up " + P[pair[0]].name + " v " + P[pair[1]].name
          : "A point each";
      }
      el.primary.textContent = "Next game";
      el.undo.hidden = true;
    } else {
      el.headline.textContent = P[current].name + "'s turn";
      el.headline.style.color = P[current].color;
      el["headline-sub"].textContent = out.length
        ? "Sitting out: " + listNames(out)
        : "Four in a row wins";
      el.primary.textContent = "Restart game";
      el.undo.hidden = false;
      el.undo.disabled = game.moves.length === 0;
    }

    PLAYERS.forEach(function(p){
      var s = seatNodes[p.id], txt;
      s.row.classList.toggle("out", !playing[p.id]);
      s.row.classList.toggle("active", p.id === current);
      s.row.classList.toggle("winner", game.over && game.winner === p.id);
      if(!playing[p.id]) txt = "sitting out";
      else if(!game.over) txt = (p.id === current) ? "to play" : "waiting";
      else if(!game.winner) txt = "drawn";
      else txt = (game.winner === p.id) ? "winner" : "beaten";
      s.state.textContent = txt;
    });

    el.live.textContent = game.over
      ? (game.winner ? P[game.winner].name + " wins." : "Game drawn.")
      : P[current].name + " to play.";
  }

  function ordinal(n){ return ["1st","2nd","3rd","4th","5th","6th"][n-1] || (n+"th"); }

  function renderLedger(){
    var anyPlayed = IDS.some(function(id){ return ledger.stats[id].p > 0; });
    var sorted = PLAYERS.slice().sort(function(a,b){
      return points(b.id) - points(a.id) ||
             ledger.stats[b.id].w - ledger.stats[a.id].w ||
             ledger.stats[a.id].l - ledger.stats[b.id].l ||
             a.name.localeCompare(b.name);
    });
    el.standings.innerHTML = sorted.map(function(p, i){
      var s = ledger.stats[p.id];
      return '<div class="row"><div>'+
          '<div class="who"><span class="name" style="color:'+p.color+'">'+p.name+'</span>'+
          (anyPlayed ? '<span class="rank">'+ordinal(i+1)+'</span>' : '')+'</div>'+
          '<div class="tally">'+tally(s.w, p.color)+'</div></div>'+
        '<div class="figures"><b>'+points(p.id)+'</b><i>points</i><br>'+
          s.p+' played<br>'+s.w+'W · '+s.d+'D · '+s.l+'L</div></div>';
    }).join("");

    el.h2h.innerHTML = PAIRS.map(function(pr){
      var h = ledger.h2h[pr.join("|")], total = h.a + h.b + h.d;
      return '<div class="h2h-row"><span>'+
        '<span style="color:'+P[pr[0]].color+'">'+P[pr[0]].name+'</span> '+h.a+' — '+h.b+
        ' <span style="color:'+P[pr[1]].color+'">'+P[pr[1]].name+'</span></span>'+
        '<span class="res">'+(total ? h.d+" drawn" : "not played")+'</span></div>';
    }).join("");

    el.log.innerHTML = ledger.log.length
      ? ledger.log.map(function(g){
          var who = g.players.length > 2 ? "All four"
                  : P[g.players[0]].name + " v " + P[g.players[1]].name;
          return '<li><span>'+who+'</span><span>'+
            (g.winner ? "<b>"+P[g.winner].name+"</b>" : "<b>drawn</b>")+
            (g.mode === "free" ? " · 6×6" : "")+'</span></li>';
        }).join("")
      : '<li class="empty">Nothing played yet. Pick a pairing and take the first turn.</li>';
  }

  /* ---------------- input ---------------- */

  el.cells.addEventListener("click", function(e){
    var b = e.target.closest(".cell");
    if(b && !b.disabled) play(+b.dataset.i);
  });

  el.cells.addEventListener("keydown", function(e){
    var b = e.target.closest(".cell");
    if(!b) return;
    var step = { ArrowRight:1, ArrowLeft:-1, ArrowDown:game.size, ArrowUp:-game.size };
    if(!(e.key in step)) return;
    e.preventDefault();
    var i = +b.dataset.i, n = game.size, r = Math.floor(i/n), c = i%n;
    if((e.key === "ArrowRight" && c === n-1) || (e.key === "ArrowLeft" && c === 0) ||
       (e.key === "ArrowDown" && r === n-1) || (e.key === "ArrowUp" && r === 0)) return;
    var next = cellNodes[i + step[e.key]];
    if(next) next.focus();
  });

  function setMode(next){
    if(mode === next) return;
    mode = next;
    document.getElementById("mode-duel").setAttribute("aria-pressed", String(next === "duel"));
    document.getElementById("mode-free").setAttribute("aria-pressed", String(next === "free"));
    newGame();
  }
  document.getElementById("mode-duel").addEventListener("click", function(){ setMode("duel"); });
  document.getElementById("mode-free").addEventListener("click", function(){ setMode("free"); });

  el.primary.addEventListener("click", newGame);
  el.undo.addEventListener("click", undo);

  el.reset.addEventListener("click", function(){
    if(!resetArmed){
      resetArmed = true;
      el.reset.textContent = "Tap again to wipe all records";
      resetTimer = setTimeout(function(){
        resetArmed = false; el.reset.textContent = "Reset ledger";
      }, 4000);
      return;
    }
    clearTimeout(resetTimer);
    resetArmed = false;
    el.reset.textContent = "Reset ledger";
    ledger = blankLedger();
    queue = IDS.slice();
    pair = [IDS[0], IDS[1]];
    starterFlip = 0;
    save();
    renderLedger();
    newGame();
  });

  load().then(function(){
    note();
    buildSeats();
    renderLedger();
    newGame();
  });
})();
</script>
